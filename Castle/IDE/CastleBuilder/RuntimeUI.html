<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #1e1e1e;
            color: #d6d6d6;
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 12px;
            overflow: hidden;
        }
        .wrap {
            height: 100%;
            overflow: auto;
            padding: 10px;
            box-sizing: border-box;
        }
        .box {
            border: 1px solid #3a3a3a;
            background: #242424;
            padding: 8px 10px 10px;
            margin: 0 0 10px 0;
        }
        .box-title {
            font-size: 11px;
            color: #9a9a9a;
            letter-spacing: 0.08em;
            margin: 0 0 8px 0;
        }
        .row {
            display: block;
            height: 26px;
            margin: 0 0 4px 0;
        }
        .lbl {
            display: inline-block;
            width: 110px;
            color: #9a9a9a;
            font-size: 11px;
        }
        input[type="text"], input:not([type]), select {
            display: inline-block;
            width: 160px;
            height: 22px;
            box-sizing: border-box;
            padding: 0 6px;
            background: #2a2a2a;
            color: #e6e6e6;
            border: 1px solid #555;
            vertical-align: middle;
            font-size: 12px;
        }
        input[type="range"] {
            display: inline-block;
            width: 160px;
            height: 22px;
            margin: 0;
            padding: 0;
            vertical-align: middle;
        }
        .val {
            display: inline-block;
            width: 44px;
            margin-left: 6px;
            font-size: 11px;
            color: #c8c8c8;
            vertical-align: middle;
        }
        .hint {
            display: block;
            font-size: 11px;
            color: #7a7a7a;
            margin: 4px 0 0 0;
        }
        .check {
            display: block;
            height: 22px;
            margin: 0 0 4px 0;
        }
        input[type="checkbox"] {
            display: inline-block;
            width: 16px;
            height: 16px;
            min-width: 16px;
            min-height: 16px;
            margin: 0 8px 0 0;
            padding: 0;
            vertical-align: middle;
            background: #383838;
            border: 1px solid #8a8a8a;
            color: #7cffcb;
        }
        .check .lbl {
            width: auto;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="box">
            <div class="box-title">PHYSICS</div>
            <div class="check">
                <input id="runtime-fixed-step" type="checkbox">
                <span class="lbl">Fixed step</span>
            </div>
            <div class="row">
                <span class="lbl">Step rate Hz</span>
                <input id="runtime-step-rate" type="text" value="60">
            </div>
            <div class="row">
                <span class="lbl">Gravity Z</span>
                <input id="runtime-gravity-z" type="text" value="-9.81">
            </div>
            <div class="row">
                <span class="lbl">Frame cap Hz</span>
                <input id="runtime-frame-cap" type="text" value="0">
            </div>
        </div>
        <div class="box">
            <div class="box-title">MOUSE</div>
            <div class="row">
                <span class="lbl">Look X</span>
                <input id="runtime-look-x" type="range" min="0" max="100" step="1" value="20" data-hook="RuntimeApply">
                <span id="runtime-look-x-val" class="val">20</span>
            </div>
            <div class="row">
                <span class="lbl">Look Y</span>
                <input id="runtime-look-y" type="range" min="0" max="100" step="1" value="20" data-hook="RuntimeApply">
                <span id="runtime-look-y-val" class="val">20</span>
            </div>
        </div>
        <div class="box">
            <div class="box-title">SERVER</div>
            <div class="row">
                <span class="lbl">Mode</span>
                <select id="runtime-mode">
                    <option value="Single Player">Single Player</option>
                    <option value="Multiplayer">Multiplayer</option>
                    <option value="Peer to Peer">Peer to Peer</option>
                    <option value="Hosted">Hosted</option>
                </select>
            </div>
        </div>
    </div>
</body>
</html>
