<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--<title>New Project</title>-->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, Arial, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            overflow: hidden;
            height: 100%;
        }

        .modal {
            width: 420px;
            height: 460px;
            background: #252526;
            border: 1px solid #383838;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 32px;
            display: flex;
            flex-direction: column;
        }

        h2 {
            margin: 0 0 24px 0;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            color: #7CFFCB;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #cccccc;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            background: #1e1e1e;
            border: 1px solid #383838;
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 18px;
        }

            input[type="text"]:focus, select:focus {
                outline: none;
                border-color: #7CFFCB;
                background: #2a2a2a;
            }

        .toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }

        .button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .primary {
            background: #7CFFCB;
            color: #111111;
        }

            .primary:hover {
                background: #a0ffdb;
                transform: translateY(-1px);
            }

        .cancel {
            background: #383838;
            color: #cccccc;
        }

            .cancel:hover {
                background: #4a4a4a;
            }
    </style>
</head>
<body>
    <div class="modal">
        <h2>New Project</h2>

        <label for="project-name">Project Name</label>
        <input type="text" id="project-name" placeholder="My Awesome Game">

        <label for="game-type">Game Type</label>
        <select id="game-type">
            <option>2D</option>
            <option>2D Sidescrolling</option>
            <option>3D FPS</option>
            <option>3D Isometric</option>
            <option>3D Over Shoulder</option>
            <option>3D Third Person</option>
            <option>3D Dynamic</option>
        </select>

        <label for="project-mode">Mode</label>
        <select id="project-mode">
            <option>Single Player</option>
            <option>Hosted</option>
            <option>Server</option>
        </select>

        <div class="toggle">
            <input type="checkbox" id="allow-mods" checked>
            <label for="allow-mods">Allow Mods</label>
        </div>

        <div class="buttons">
            <div class="button cancel" data-hook="Cancel">Cancel</div>
            <div class="button primary" data-hook="CreateNewProjectConfirm">Create Project</div>
        </div>
    </div>
</body>
</html>
