<!-- File: SceneEditorUI.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        .scene-toolbar {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 28, 36, 0.96);
            padding: 12px 20px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.55);
            border: 1px solid rgba(95,95,115,0.6);
            z-index: 300;
            font-family: system-ui, sans-serif;
        }

        .scene-label {
            color: #d0d0d0;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        #sceneSelect {
            min-width: 220px;
            padding: 8px 12px;
            background: #222228;
            color: #f0f0f0;
            border: 1px solid #555566;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

            #sceneSelect:focus {
                border-color: #777799;
            }

        .new-scene-btn {
            padding: 8px 18px;
            background: #444455;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            transition: all 0.2s;
        }

            .new-scene-btn:hover {
                background: #555566;
                transform: translateY(-1px);
            }

        .place-entity-btn {
            padding: 8px 18px;
            background: #3a5a8a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            transition: all 0.2s;
            margin-left: 12px;
        }

            .place-entity-btn:hover {
                background: #4a6a9a;
                transform: translateY(-1px);
            }

        .place-sound-btn {
            padding: 8px 18px;
            background: #5a3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            transition: all 0.2s;
            margin-left: 12px;
        }

            .place-sound-btn:hover {
                background: #6a4a9a;
                transform: translateY(-1px);
            }

        .physics-debug-btn {
            padding: 8px 18px;
            background: #2a5a4a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            transition: all 0.2s;
            margin-left: 12px;
        }

            .physics-debug-btn:hover {
                background: #3a6a5a;
                transform: translateY(-1px);
            }

        .acoustic-debug-btn {
            padding: 8px 18px;
            background: #4a2a6a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            transition: all 0.2s;
            margin-left: 12px;
        }

            .acoustic-debug-btn:hover {
                background: #5a3a7a;
                transform: translateY(-1px);
            }
    </style>
</head>
<body>
    <div class="scene-toolbar">
        <span class="scene-label">Active Scene:</span>
        <select id="sceneSelect" data-hook="SceneSelected">
            <!-- Populated dynamically -->
        </select>
        <button class="new-scene-btn" data-hook="CreateNewScene">+ New Scene</button>
        <button class="place-entity-btn" data-hook="OpenPlaceEntityBrowser">Place Entity</button>
        <button class="place-sound-btn" data-hook="PlaceSoundSource">Place Sound</button>
        <button class="physics-debug-btn" data-hook="TogglePhysicsDebug">Physics Debug</button>
        <button class="acoustic-debug-btn" data-hook="ToggleAcousticDebug">Acoustic Debug</button>
    </div>
</body>
</html>
