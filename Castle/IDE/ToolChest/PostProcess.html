<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Segoe UI, system-ui, sans-serif;
            background: #1e1e1e;
            color: #ddd;
            padding: 12px;
            margin: 0;
            overflow: hidden;
        }
        .panel {
            background: #252526;
            border: 1px solid #383838;
            padding: 12px;
            overflow: hidden;
        }
        .title { color: #f0f0f0; margin: 0 0 8px 0; }
        .field {
            font-size: 12px;
            color: #aaa;
            margin: 6px 0 2px;
            display: block;
            white-space: nowrap;
        }
        select, input {
            background: #3c3c3c;
            color: #ddd;
            border: 1px solid #555;
            padding: 4px 6px;
            width: 100%;
            box-sizing: border-box;
        }
        input[type="range"] {
            padding: 0;
            height: 22px;
        }
        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }
        .hint {
            display: block;
            white-space: nowrap;
            font-size: 11px;
            color: #888;
            margin: 2px 0;
            line-height: 1.2;
        }
        .readout {
            display: block;
            font-size: 12px;
            color: #7CFFCB;
            background: #1a1a1a;
            border: 1px solid #383838;
            padding: 4px 6px;
            margin: 2px 0 6px;
            white-space: nowrap;
        }
        .actions { display: flex; gap: 8px; margin-top: 10px; }
        button {
            background: #c9a227;
            color: #111;
            padding: 8px 16px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #e0b83a; }
        button.secondary { background: #444; color: #ddd; font-weight: 500; }
        button.secondary:hover { background: #555; }
        .check { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .check input { width: auto; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="title">Post Process</div>
        <div class="check">
            <input id="pp-sun-enabled" type="checkbox">
            <div class="field">Enable sun</div>
        </div>
        <div class="field">Azimuth</div>
        <input id="pp-sun-azimuth" type="range" min="0" max="360" step="1" value="187">
        <div id="pp-sun-azimuth-val" class="readout">187</div>
        <div class="field">Elevation</div>
        <input id="pp-sun-elevation" type="range" min="5" max="85" step="1" value="31">
        <div id="pp-sun-elevation-val" class="readout">31</div>
        <div class="field">Travel vector</div>
        <div id="pp-sun-vector" class="readout">-0.850, 0.100, -0.520</div>
        <div class="row">
            <div>
                <div class="field">Intensity</div>
                <input id="pp-sun-intensity" value="1">
            </div>
            <div>
                <div class="field">Shadows</div>
                <select id="pp-shadow-quality">
                    <option value="Off">Off</option>
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                    <option value="Ultra">Ultra</option>
                </select>
            </div>
        </div>
        <div class="check">
            <input id="pp-sun-cast-shadows" type="checkbox" checked>
            <div class="field">Sun casts shadows</div>
        </div>
        <div class="field">Fog mode</div>
        <select id="pp-fog-mode">
            <option value="Off" selected>Off</option>
            <option value="Exponential">Exponential</option>
            <option value="Height">Height</option>
            <option value="Volumetric">Volumetric</option>
        </select>
        <div class="row">
            <div>
                <div class="field">Fog quality</div>
                <select id="pp-fog-quality">
                    <option value="Off" selected>Off</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <div>
                <div class="field">Density</div>
                <input id="pp-fog-density" value="0.003">
            </div>
        </div>
        <div class="field">Fog start</div>
        <input id="pp-fog-start" value="0">
        <div class="hint">Check Enable sun, then Apply.</div>
        <div class="hint">Play Game uses these settings.</div>
        <div class="actions">
            <button data-hook="PostProcessApply">Apply</button>
            <button class="secondary" data-hook="CancelPostProcess">Cancel</button>
        </div>
    </div>
</body>
</html>
