<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ddd;
            margin: 0;
            padding: 0;
            font-size: 13px;
        }

        .toolbar {
            background-color: #222;
            padding: 4px;
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #333;
        }

        button {
            padding: 3px 8px;
            background: #333;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
        }

            button:hover {
                background: #444;
            }

        .address-bar {
            flex: 1;
            background: #1f1f1f;
            padding: 4px 8px;
            border: 1px solid #444;
            border-radius: 3px;
            font-size: 12px;
        }

        .file-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

            .file-table th {
                background: #252525;
                padding: 6px 8px;
                text-align: left;
                border-bottom: 1px solid #333;
                cursor: pointer;
            }

                .file-table th:hover {
                    background: #333;
                }

            .file-table td {
                padding: 5px 8px;
                border-bottom: 1px solid #333;
            }

            .file-table tr:hover {
                background: #2a2a2a;
            }

        .icon {
            width: 24px;
            text-align: center;
        }

        .name {
            flex: 1;
        }

        .size, .date {
            width: 90px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button data-hook="back">back</button>
        <button data-hook="forward">forward</button>
        <button data-hook="up">up</button>
        <div class="address-bar"><!--CURRENT_DIR--></div>
    </div>

    <table class="file-table">
        <thead>
            <tr>
                <th class="icon"></th>
                <th class="name" data-hook="sort-name">Name</th>
                <th class="size" data-hook="sort-size">Size</th>
                <th class="date" data-hook="sort-date">Modified</th>
            </tr>
        </thead>
        <tbody>
            <!--DYNAMIC_ITEMS-->
        </tbody>
    </table>
</body>
</html>
