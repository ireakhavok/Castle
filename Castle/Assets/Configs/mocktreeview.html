<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--<title>Mock Hierarchy - Professional Tree</title>-->
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1e1e1e;
            color: #ccc;
            font-family: Arial, sans-serif;
            font-size: 13px;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: #252526;
            padding: 8px 12px;
            border-bottom: 1px solid #333;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .tree-container {
            padding: 8px;
            overflow: auto;
            height: calc(100vh - 88px);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            padding: 3px 4px;
            border-radius: 3px;
        }

            li:hover {
                background: #2d2d2d;
            }

            li.selected {
                background: #094771;
                color: white;
            }

        .toggle {
            width: 20px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            color: #888;
        }

        .label {
            flex: 1;
            padding-left: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .children {
            padding-left: 24px;
        }

        .footer {
            background: #252526;
            padding: 6px;
            text-align: center;
            font-size: 11px;
            color: #888;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>Hierarchy</span>
        <div>
            <button>⟳ Refresh</button>
            <button>Collapse All</button>
        </div>
    </div>

    <div class="tree-container">
        <ul>
            <li class="node selected">
                <span class="toggle">▼</span>
                <span class="label">Scene Editor</span>
            </li>
            <ul class="children">
                <li class="node">
                    <span class="toggle">▼</span>
                    <span class="label">Entities</span>
                </li>
                <ul class="children">
                    <li class="node"><span class="toggle"> </span><span class="label">Player (Entity 1)</span></li>
                    <li class="node"><span class="toggle"> </span><span class="label">Enemy (Entity 2)</span></li>
                </ul>
                <li class="node">
                    <span class="toggle">▶</span>
                    <span class="label">Lights</span>
                </li>
                <li class="node">
                    <span class="toggle">▶</span>
                    <span class="label">Cameras</span>
                </li>
            </ul>
        </ul>
    </div>

    <div class="footer">Right-click a node for Properties</div>
</body>
</html>
