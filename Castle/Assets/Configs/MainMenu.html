<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MainMenu</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: sans-serif;
            background: #121212;
            color: #ffffff;
            overflow: hidden;
        }

        .menu {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: url('../Static_Images/Main_Background.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            gap: 20px;
            padding: 20px;
        }

        button {
            background: rgba(255, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid rgba(0, 0, 0, 1);
            color: #fff;
            width: 200px;
            height: 50px;
        }

            button:hover {
                background: rgba(255, 255, 255, 0.8);
                transform: translateY(-2px);
                color: #000;
            }

        .sandbox {
            background: rgba(0, 255, 0, 0.8);
            border: 1px solid rgba(0, 0, 0, 1);
        }

            .sandbox:hover {
                background: rgba(255, 255, 255, 0.8);
                color: #000;
            }

        .editor {
            background: rgba(0, 128, 255, 0.8);
            border: 1px solid rgba(0, 77, 153, 1);
        }

            .editor:hover {
                background: rgba(51, 179, 255, 0.8);
                color: #000;
            }
    </style>
</head>
<body>
    <div class="menu">
        <!--<button data-hook="SiegeEngine.Scenes.MMOModeScene.MMOModeScene">MMO Mode</button>-->
        <!--<button data-hook="SiegeEngine.Scenes.StandaloneModeScene.StandaloneModeScene">Standalone Mode</button>-->
        <!--<button data-hook="SiegeEngine.Scenes.SteamMatchmakingScene.SteamMatchmakingScene">Steam Matchmaking</button>-->
        <!--<button data-hook="SiegeEngine.Scenes.SettingsScene.SettingsScene">Settings</button>-->
        <!--<button data-hook="SiegeEngine.Scenes.InviteToLobbyScene.InviteToLobbyScene">Invite to Lobby</button>-->
        <button class="sandbox" data-hook="SiegeEngine.Scenes.SandboxScene.SandboxScene">Sandbox Mode</button>
        <!--<button data-hook="SiegeEngine.Scenes.ExitScene.ExitScene">Exit</button>-->
        <!--<button class="editor" data-hook="SiegeEngine.Scenes.LevelEditorScene.LevelEditorScene">Level Editor</button>-->
    </div>
</body>
</html>
