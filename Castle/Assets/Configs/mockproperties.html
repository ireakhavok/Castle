<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--<title>Mock Properties - Clean Inspector</title>-->
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1e1e1e;
            color: #ccc;
            font-family: Arial, sans-serif;
            font-size: 13px;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: #252526;
            padding: 8px 12px;
            border-bottom: 1px solid #333;
            font-weight: bold;
        }

        .content {
            padding: 8px;
            overflow: auto;
            height: calc(100vh - 88px);
        }

        .property-row {
            display: flex;
            align-items: center;
            background: #252526;
            margin-bottom: 1px;
            padding: 6px 10px;
        }

            .property-row:hover {
                background: #2d2d2d;
            }

        .property-name {
            width: 150px;
            color: #aaa;
            flex-shrink: 0;
        }

        input {
            flex: 1;
            background: #333;
            border: 1px solid #555;
            color: #ccc;
            padding: 4px 6px;
        }

        .footer {
            background: #252526;
            padding: 6px;
            text-align: center;
            font-size: 11px;
            color: #888;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="header">Properties - Player (Entity 1)</div>

    <div class="content">
        <div class="property-row">
            <div class="property-name">Position X</div>
            <input type="number" value="12.5">
        </div>
        <div class="property-row">
            <div class="property-name">Position Y</div>
            <input type="number" value="8.3">
        </div>
        <div class="property-row">
            <div class="property-name">Rotation</div>
            <input type="number" value="45">
        </div>
        <div class="property-row">
            <div class="property-name">Health</div>
            <input type="number" value="100">
        </div>
        <div class="property-row">
            <div class="property-name">Is Visible</div>
            <input type="checkbox" checked>
        </div>
    </div>

    <div class="footer">Select an object in the Hierarchy to inspect</div>
</body>
</html>
