<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="EditorMenu.css">
</head>
<body>
    <div class="title">Level Editor</div>
    <button class="btn" id="save-level">Save Level</button>
    <select class="dropdown" id="brush-selector">
        <option value="Wall">Wall</option>
        <option value="Floor">Floor</option>
        <option value="Door">Door</option>
        <option value="Trap">Trap</option>
        <option value="Light">Light</option>
        <option value="Fire">Fire</option>
        <option value="Roof">Roof</option>
        <option value="Window">Window</option>
        <option value="Pathway">Pathway</option>
        <option value="Road">Road</option>
        <option value="Bridge">Bridge</option>
        <option value="Water">Water</option>
        <option value="Monster">Monster</option>
        <option value="Raise">Raise</option>
        <option value="Lower">Lower</option>
    </select>
    <input type="checkbox" id="grid-snap" class="toggle"> Grid Snap
    <button class="btn" id="test-level">Test Level</button>
    <button class="btn" id="back">Back</button>
    <div class="hint">Click to place objects</div>
</body>
</html>
