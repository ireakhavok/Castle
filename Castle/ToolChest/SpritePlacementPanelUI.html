<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #ddd;
            padding: 16px;
            margin: 0;
            width: 100%;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 22px 0;
            color: #4fc3f7;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        label {
            font-size: 13.5px;
            white-space: nowrap;
            min-width: 74px;
            font-weight: 500;
            color: #ccc;
        }

        input[type="text"] {
            flex: 1;
            padding: 7px 9px;
            background: #2a2a2a;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 13.5px;
        }

        input[type="number"] {
            width: 80px;
            padding: 6px 8px;
            background: #2a2a2a;
            color: #ffcc66;
            border: 1px solid #555;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-weight: 700;
            text-align: right;
            font-size: 13.5px;
        }

        button {
            padding: 7px 12px;
            background: #3a3a3a;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

            button:hover {
                background: #4a4a4a;
            }

        .preview {
            margin-top: 12px;
            width: 100%;
            height: 160px;
            background: #1a1a1a;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

            .preview img {
                max-width: 100%;
                max-height: 100%;
                image-rendering: pixelated;
            }

        .status {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <h2>🖼️ Sprite Tool</h2>
    <div class="control-row">
        <label>Texture</label>
        <input type="text" id="texturePath" placeholder="No PNG selected" readonly>
        <button data-hook="BrowseTexture">Browse PNG...</button>
    </div>
    <div class="control-row">
        <label>Width</label>
        <input type="number" id="sizeWidth" value="2.0" step="0.1" min="0.1">
        <label style="min-width:40px;">Height</label>
        <input type="number" id="sizeHeight" value="2.0" step="0.1" min="0.1">
    </div>
    <div class="preview" id="previewBox">
        <div style="color:#666; font-style:italic;">Select PNG — ghost follows mouse in scene</div>
    </div>
    <div class="status" id="statusText">Select a sprite to enable placement mode</div>
    <button data-hook="ClosePanel" style="margin-top:20px; width:100%; padding:12px;">Close Sprite Tool</button>
</body>
</html>
