<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #1e1e1e;
            color: #cccccc;
            font-family: Arial, sans-serif;
            font-size: 13px;
            overflow: hidden;
        }

        .panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .header {
            background: #252526;
            padding: 6px 10px;
            border-bottom: 1px solid #333333;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tree-container {
            flex: 1;
            overflow: auto;
            padding: 4px 2px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .node {
            display: block;
            padding: 2px 4px;
            cursor: pointer;
            user-select: none;
            min-height: 28px;
            box-sizing: border-box;
            position: relative;
        }

            .node:hover {
                background: #2d2d2d;
            }

            .node.selected {
                background: #094771;
                color: white;
            }

        .toggle {
            display: inline-block;
            width: 18px;
            color: #888888;
            cursor: pointer;
            font-size: 12px;
            vertical-align: middle;
        }

        .label {
            padding-left: 2px;
            vertical-align: middle;
            display: inline-block;
        }

        .children {
            padding-left: 22px;
            margin-top: 2px;
            margin-bottom: 2px;
        }

        .footer {
            background: #252526;
            padding: 4px;
            border-top: 1px solid #333333;
            font-size: 11px;
            color: #888888;
            text-align: center;
        }

        button {
            background: #333333;
            color: #cccccc;
            border: 1px solid #555555;
            padding: 3px 8px;
            margin-left: 4px;
            cursor: pointer;
            font-size: 12px;
        }

            button:hover {
                background: #444444;
            }
    </style>
</head>
<body>
    <div class="panel">
        <div class="header">
            <span>Hierarchy</span>
            <div>
                <button data-hook="RefreshTree">⟳ Refresh</button>
                <button data-hook="CollapseAll">Collapse All</button>
            </div>
        </div>

        <div class="tree-container">
            <ul id="treeRoot">
                <!--TREE_NODES-->
            </ul>
        </div>

        <div class="footer">
            Right-click a node for Properties
        </div>
    </div>
</body>
</html>
