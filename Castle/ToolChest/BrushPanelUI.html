<!DOCTYPE html>
<html>
<head>
    <title>Brush Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #ddd;
            padding: 16px;
            margin: 0;
            width: 100%;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 22px 0;
            color: #4fc3f7;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        label {
            font-size: 13.5px;
            white-space: nowrap;
            min-width: 74px;
            font-weight: 500;
            color: #ccc;
            user-select: none;
        }

        .slider-wrapper {
            flex: 1;
            min-width: 0;
            padding: 2px 0;
        }

        input[type="range"] {
            width: 100%;
            height: 30px;
            padding: 0 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            accent-color: #4fc3f7;
        }

        .value-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            width: 96px; /* fixed width for perfect OCD alignment across all controls */
        }

        .value-input {
            width: 70px;
            padding: 6px 8px;
            background: #2a2a2a;
            color: #ffcc66;
            border: 1px solid #555;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-weight: 700;
            text-align: right;
            font-size: 13.5px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
            transition: border-color 0.1s;
        }

            .value-input:focus {
                border-color: #4fc3f7;
                outline: none;
            }

        .unit {
            color: #777;
            font-size: 13px;
            font-weight: 400;
            min-width: 20px;
        }

        select {
            flex: 1;
            padding: 7px 9px;
            background: #2a2a2a;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 13.5px;
        }

        button {
            margin-top: 12px;
            padding: 13px;
            width: 100%;
            background: #4fc3f7;
            color: #111;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.3px;
            transition: all 0.12s ease;
        }

            button:hover {
                background: #29b6f6;
                transform: translateY(-1px);
            }
    </style>
</head>
<body>
    <h2>🌲 Brush Tool</h2>

    <!-- Shape -->
    <div class="control-row">
        <label>Shape</label>
        <select data-hook="BrushShapeChanged">
            <option value="GaussianCircle" selected>Gaussian Circle</option>
            <option value="Circle">Circle</option>
            <option value="Square">Square</option>
            <option value="GaussianSquare">Gaussian Square</option>
        </select>
    </div>

    <!-- Mode -->
    <div class="control-row">
        <label>Mode</label>
        <select data-hook="BrushModeChanged">
            <option value="Raise" selected>Raise Terrain</option>
            <option value="Lower">Lower Terrain</option>
            <option value="Smooth">Smooth</option>
            <option value="Flatten">Flatten</option>
            <option value="Noise">Add Noise</option>
            <option value="Sharpen">Sharpen</option>
        </select>
    </div>

    <!-- Size -->
    <div class="control-row">
        <label>Size</label>
        <div class="slider-wrapper">
            <input type="range" id="sizeSlider" min="1" max="100" value="10" step="0.5" data-hook="BrushSizeChanged">
        </div>
        <div class="value-group">
            <input type="number" id="sizeInput" value="10" step="0.5" class="value-input">
            <span class="unit">m</span>
        </div>
    </div>

    <!-- Intensity -->
    <div class="control-row">
        <label>Intensity</label>
        <div class="slider-wrapper">
            <input type="range" id="intensitySlider" min="0.1" max="5" value="1" step="0.1" data-hook="BrushIntensityChanged">
        </div>
        <div class="value-group">
            <input type="number" id="intensityInput" value="1" step="0.1" class="value-input">
        </div>
    </div>

    <button data-hook="ClosePanel">Close Panel</button>

    <script>
        function syncSliderToInput(sliderId, inputId) {
            const slider = document.getElementById(sliderId);
            const input = document.getElementById(inputId);
            if (!slider || !input) return;

            slider.addEventListener('input', () => {
                input.value = parseFloat(slider.value).toFixed(2);
            });

            input.addEventListener('input', () => {
                let val = parseFloat(input.value);
                if (isNaN(val)) val = parseFloat(slider.min);
                val = Math.max(parseFloat(slider.min), Math.min(parseFloat(slider.max), val));
                slider.value = val;
            });
        }

        window.addEventListener('load', () => {
            syncSliderToInput('sizeSlider', 'sizeInput');
            syncSliderToInput('intensitySlider', 'intensityInput');
        });
    </script>
</body>
</html>
