<!DOCTYPE html>
<html>
<head>
    <title>Brush Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #ddd;
            padding: 15px;
            margin: 0;
        }

        h2 {
            margin-top: 0;
            color: #4fc3f7;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 0 5px;
            gap: 10px;
        }

        label {
            font-size: 13px;
            white-space: nowrap;
        }

        .value-input {
            width: 80px;
            padding: 4px 6px;
            background: #333;
            color: #ffcc66;
            border: 1px solid #555;
            border-radius: 3px;
            font-family: monospace;
            font-weight: bold;
            text-align: right;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 6px;
            background: #333;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 3px;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background: #4fc3f7;
            color: #111;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background: #29b6f6;
            }
    </style>
</head>
<body>
    <h2>🌲 Brush Tool</h2>

    <div class="row">
        <label>Shape</label>
        <select data-hook="BrushShapeChanged">
            <option value="GaussianCircle" selected>Gaussian Circle (Recommended)</option>
            <option value="Circle">Circle</option>
            <option value="Square">Square</option>
            <option value="GaussianSquare">Gaussian Square</option>
        </select>
    </div>

    <div class="row">
        <label>Mode</label>
        <select data-hook="BrushModeChanged">
            <option value="Raise" selected>Raise Terrain</option>
            <option value="Lower">Lower Terrain</option>
            <option value="Smooth">Smooth</option>
            <option value="Flatten">Flatten</option>
            <option value="Noise">Add Noise</option>
            <option value="Sharpen">Sharpen</option>
        </select>
    </div>

    <div class="row">
        <label>Size</label>
        <input type="number" id="sizeInput" value="10" step="0.5" class="value-input">
        <span style="color:#666">m</span>
    </div>
    <input type="range" id="sizeSlider" min="1" max="100" value="10" step="0.5" data-hook="BrushSizeChanged">

    <div class="row">
        <label>Intensity</label>
        <input type="number" id="intensityInput" value="1" step="0.1" class="value-input">
    </div>
    <input type="range" id="intensitySlider" min="0.1" max="5" value="1" step="0.1" data-hook="BrushIntensityChanged">

    <button data-hook="ApplyBrushNow">Apply Brush (Preview)</button>

    <script>
        // Real-time two-way binding between sliders and number inputs
        function syncSliderToInput(sliderId, inputId) {
            const slider = document.getElementById(sliderId);
            const input = document.getElementById(inputId);
            if (!slider || !input) return;

            slider.addEventListener('input', () => {
                input.value = parseFloat(slider.value).toFixed(2);
            });

            input.addEventListener('input', () => {
                let val = parseFloat(input.value);
                if (isNaN(val)) val = parseFloat(slider.min);
                val = Math.max(parseFloat(slider.min), Math.min(parseFloat(slider.max), val));
                slider.value = val;
            });
        }

        // Initialize sync for both controls
        window.addEventListener('load', () => {
            syncSliderToInput('sizeSlider', 'sizeInput');
            syncSliderToInput('intensitySlider', 'intensityInput');
        });
    </script>
</body>
</html>
