<!DOCTYPE html>
<html>
<head>
    <title>Brush Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #ddd;
            padding: 15px;
            margin: 0;
        }

        h2 {
            margin-top: 0;
            color: #4fc3f7;
        }

        label {
            display: block;
            margin: 12px 0 5px;
            font-size: 13px;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 6px;
            background: #333;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 3px;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background: #4fc3f7;
            color: #111;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background: #29b6f6;
            }

        .value {
            float: right;
            color: #ffcc66;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h2>🌲 Brush Tool</h2>

    <label>Shape</label>
    <select data-hook="BrushShapeChanged">
        <option value="GaussianCircle" selected>Gaussian Circle (Recommended)</option>
        <option value="Circle">Circle</option>
        <option value="Square">Square</option>
        <option value="GaussianSquare">Gaussian Square</option>
    </select>

    <label>Mode</label>
    <select data-hook="BrushModeChanged">
        <option value="Raise" selected>Raise Terrain</option>
        <option value="Lower">Lower Terrain</option>
        <option value="Smooth">Smooth</option>
        <option value="Flatten">Flatten</option>
        <option value="Noise">Add Noise</option>
        <option value="Sharpen">Sharpen</option>
    </select>

    <label>Size: <span id="sizeValue" class="value">10.0</span>m</label>
    <input type="range" min="1" max="100" value="10" step="0.5" data-hook="BrushSizeChanged">

    <label>Intensity: <span id="intensityValue" class="value">1.0</span></label>
    <input type="range" min="0.1" max="5" step="0.1" value="1" data-hook="BrushIntensityChanged">

    <button data-hook="ApplyBrushNow">Apply Brush (Preview)</button>
</body>
</html>
