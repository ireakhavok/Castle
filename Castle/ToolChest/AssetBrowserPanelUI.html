<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Browser</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #1e1e1e;
            color: #cccccc;
            font-family: Arial, sans-serif;
            font-size: 13px;
            overflow: hidden;
        }
        .panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .header {
            background: #252526;
            padding: 6px 10px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toolbar {
            background: #252526;
            padding: 4px 8px;
            border-bottom: 1px solid #333;
            display: flex;
            gap: 6px;
        }
        .browser {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 200px;
            background: #1e1e1e;
            border-right: 1px solid #333;
            padding: 8px;
            overflow: auto;
        }
        .main {
            flex: 1;
            padding: 8px;
            overflow: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-content: flex-start;
        }
        .item {
            width: 90px;
            text-align: center;
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
        }
        .item:hover {
            background: #2d2d2d;
        }
        .footer {
            background: #252526;
            padding: 6px;
            border-top: 1px solid #333;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="header">
            <span>Asset Browser</span>
            <button data-hook="Up">↑ Up</button>
        </div>
        <div class="toolbar">
            <input id="search" placeholder="Search assets..." style="flex:1">
        </div>
        <div class="browser">
            <div class="sidebar">
                <!-- Future: folder tree -->
                <div style="color:#888">Assets Root</div>
            </div>
            <div class="main">
                <!--ITEMS-->
            </div>
        </div>
        <div class="footer">
            Double-click to open • Drag to scene
        </div>
    </div>
</body>
</html>
