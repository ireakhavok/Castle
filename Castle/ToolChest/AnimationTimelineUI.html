<!DOCTYPE html>
<html>
<head>
    <style>
        .timeline-container {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.95);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #555;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 620px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #aaa;
            font-size: 10px;
            margin-bottom: 4px;
        }

        .timeline-bar {
            position: relative;
            width: 100%;
            height: 38px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }

        .timeline-track {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 6px;
            background: #444;
            transform: translateY(-50%);
        }

        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
            z-index: 10;
        }

        .frame-ticks {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            pointer-events: none;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-label {
            color: #ccc;
            font-size: 10px;
            min-width: 42px;
        }

        input[type=range] {
            width: 120px;
        }

        input[type=number] {
            width: 58px;
            background: #222;
            color: #eee;
            border: 1px solid #555;
            padding: 3px 5px;
            border-radius: 3px;
            font-size: 11px;
        }

        .action-btn {
            padding: 6px 13px;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

            .action-btn:hover {
                background: #777;
            }

        .frame-info {
            color: #888;
            font-size: 9px;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div class="timeline-container">
        <div class="timeline-header">
            <span>Animation Timeline</span>
            <span class="frame-info" id="frameInfo">0.0 / 10.0s</span>
        </div>

        <!-- Visual Timeline Scrubber -->
        <div id="timelineBar" class="timeline-bar" data-hook="TimelineScrub">
            <div class="timeline-track"></div>
            <div id="playhead" class="playhead" style="left: 0%;"></div>
            <div class="frame-ticks"></div>
        </div>

        <div class="controls-row">
            <div class="control-group">
                <span class="control-label">Start</span>
                <input type="number" id="startFrame" step="0.1" value="0" data-hook="TimelineCut" />
            </div>
            <div class="control-group">
                <span class="control-label">End</span>
                <input type="number" id="endFrame" step="0.1" value="10" data-hook="TimelineCut" />
            </div>
            <div class="control-group">
                <span class="control-label">Speed</span>
                <input type="range" id="speed" min="0.1" max="4" step="0.1" value="1" data-hook="TimelineCut" />
                <span id="speedValue" style="color:#aaa;font-size:10px;width:26px;">1.0x</span>
            </div>

            <button class="action-btn" data-hook="TimelineCut">Apply Cut &amp; Speed</button>
            <button class="action-btn" data-hook="TogglePlay">▶ Play / Pause</button>
        </div>
    </div>
</body>
</html>
