<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #1e1e1e;
            color: #cccccc;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            overflow: hidden;
        }

        .panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .toolbar {
            background: #252526;
            padding: 4px 8px;
            border-bottom: 1px solid #333;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .log-container {
            flex: 1;
            overflow: auto;
            padding: 8px;
            background: #0d0d0d;
            font-size: 12px;
            line-height: 1.4;
        }

        .log-line {
            padding: 1px 4px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        input[type="search"] {
            background: #1e1e1e;
            border: 1px solid #555;
            color: #ccc;
            padding: 5px 8px;
            font-family: 'Consolas', monospace;
            width: 220px;
        }

        button {
            background: #333;
            color: #ccc;
            border: 1px solid #555;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
        }

            button:hover {
                background: #444;
            }

        .levels {
            display: flex;
            gap: 10px;
            margin-left: 12px;
            font-size: 11px;
        }

            .levels label {
                display: flex;
                align-items: center;
                gap: 4px;
                cursor: pointer;
            }

            .levels input[type="checkbox"] {
                accent-color: #0d7377;
            }

        .ide-title {
            padding: 0 8px 0 4px;
            color: #7CFFCB;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="toolbar">
            <button data-hook="Clear">Clear</button>
            <input id="filterInput" type="search" placeholder="Filter logs...">
            <button data-hook="TogglePause" id="pauseBtn">Pause</button>
            <div class="levels">
                <label style="color:#ff6b6b;"><input type="checkbox" data-hook="ToggleLevel:ERROR" checked> ERR</label>
                <label style="color:#ffd93d;"><input type="checkbox" data-hook="ToggleLevel:WARN" checked> WARN</label>
                <label style="color:#6bcb77;"><input type="checkbox" data-hook="ToggleLevel:INFO" checked> INFO</label>
                <label style="color:#6bcb77;"><input type="checkbox" data-hook="ToggleLevel:DEBUG" checked> DEBUG</label>
            </div>
            <div class="ide-title" style="margin-left:auto;">Console</div>
        </div>
        <div class="log-container" id="logContainer"><!--LOGS--></div>
    </div>
</body>
</html>
