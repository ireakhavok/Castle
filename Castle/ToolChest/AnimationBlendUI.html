<!DOCTYPE html>
<html>
<head>
    <style>
        .blend-2d-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(30, 30, 30, 0.95);
            padding: 14px 18px;
            border-radius: 8px;
            border: 1px solid #555;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            display: flex;
            gap: 22px;
            align-items: flex-start;
        }

        .grid-area {
            width: 280px;
            height: 280px;
            border: 2px solid #666;
            background: linear-gradient(#444 1px, transparent 1px) 0 0 / 28px 28px, linear-gradient(90deg, #444 1px, transparent 1px) 0 0 / 28px 28px;
            position: relative;
            cursor: crosshair;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }

        .grid-label {
            position: absolute;
            font-size: 9px;
            color: #888;
        }

            .grid-label.x {
                bottom: -16px;
                left: 50%;
                transform: translateX(-50%);
            }

            .grid-label.y {
                top: 50%;
                left: -18px;
                transform: translateY(-50%) rotate(-90deg);
            }

        .current-point {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #4ade80;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }

        .clip-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f59e0b;
            border: 1px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 160px;
        }

        .coord-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .coord-label {
            color: #ccc;
            font-size: 11px;
            width: 14px;
        }

        input[type=number] {
            width: 58px;
            background: #222;
            color: #eee;
            border: 1px solid #555;
            padding: 3px 5px;
            border-radius: 3px;
            font-size: 11px;
        }

        input[type=range] {
            width: 140px;
        }

        .clip-list {
            width: 200px;
            height: 120px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #ddd;
            font-size: 10px;
            overflow-y: auto;
            padding: 4px;
        }

        .action-btn {
            padding: 6px 12px;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

            .action-btn:hover {
                background: #777;
            }
    </style>
</head>
<body>
    <div class="blend-2d-container">
        <!-- 2D Clickable Grid -->
        <div>
            <div id="blendGrid" class="grid-area" data-hook="GridClicked">
                <!-- current point and placed dots will be positioned here by the panel -->
            </div>
            <div style="position:relative; width:280px; margin-top:4px;">
                <span class="grid-label x">X →</span>
                <span class="grid-label y">Y ↑</span>
            </div>
        </div>

        <div class="controls">
            <div class="coord-row">
                <span class="coord-label">X</span>
                <input type="number" id="blendX" step="0.1" value="0" data-hook="BlendPointChanged" />
            </div>
            <div class="coord-row">
                <span class="coord-label">Y</span>
                <input type="number" id="blendY" step="0.1" value="0" data-hook="BlendPointChanged" />
            </div>
            <div class="coord-row">
                <span class="coord-label">Z</span>
                <input type="range" id="blendZ" min="-10" max="10" step="0.1" value="0" data-hook="BlendPointChanged" />
                <span id="zValue" style="color:#aaa;font-size:10px;width:24px;">0.0</span>
            </div>

            <button class="action-btn" data-hook="AddClipAtPoint">+ Place Clip at Current Point</button>
            <button class="action-btn" data-hook="CreatePack">Create &amp; Drop Pack</button>

            <div style="margin-top:8px;">
                <div style="color:#aaa;font-size:10px;margin-bottom:3px;">Placed Clips</div>
                <select id="clipList" class="clip-list" data-hook="SelectClipForTimeline" size="6"></select>
            </div>
        </div>
    </div>
</body>
</html>
