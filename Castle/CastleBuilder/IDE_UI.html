<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SiegeEngine IDE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', system-ui, Arial, sans-serif;
            font-size: 14px;
            background: #1e1e1e;
            color: #e0e0e0;
            overflow: hidden;
        }

        #ide-root {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        #ide-menu-bar {
            height: 28px;
            background: #1f1f1f;
            display: flex;
            align-items: center;
            padding: 0 8px;
            user-select: none;
            flex-shrink: 0;
        }

        .menu-item {
            padding: 0 16px;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #7CFFCB;
            font-weight: 500;
            transition: background 0.12s ease, color 0.12s ease;
        }

            .menu-item:hover {
                background: rgba(124, 255, 203, 0.12);
                color: #a0ffdb;
            }

            .menu-item:active {
                background: rgba(124, 255, 203, 0.2);
            }

        .ide-title {
            margin-left: auto;
            padding: 0 20px 0 12px;
            color: #7CFFCB;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        #ide-content {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #252526;
        }
    </style>
</head>
<body>
    <div id="ide-root">
        <!-- Professional SiegeEngine IDE Menu Bar -->
        <nav id="ide-menu-bar">
            <div class="menu-item" data-hook="CastleBuilder.MenuCommands.OpenTerrain">Castle</div>
            <div class="menu-item" data-hook="CastleBuilder.MenuCommands.OpenAnimation">Animation</div>
            <div class="menu-item" data-hook="CastleBuilder.MenuCommands.OpenAssetBrowser">Assets</div>
            <div class="menu-item" data-hook="CastleBuilder.MenuCommands.OpenProperties">Properties</div>
            <div class="menu-item" data-hook="CastleBuilder.MenuCommands.OpenTreeView">Hierarchy</div>

            <div class="ide-title">SiegeEngine IDE</div>
        </nav>

        <!-- Content area for all panels -->
        <div id="ide-content"></div>
    </div>
</body>
</html>
