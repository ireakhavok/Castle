<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #dddddd;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .toolbar {
            display: flex;
            align-items: center;
            background-color: #252526;
            padding: 5px;
            border-bottom: 1px solid #333333;
            gap: 5px;
        }

            .toolbar button {
                background-color: #333333;
                color: #dddddd;
                border: 1px solid #444444;
                border-radius: 3px;
                padding: 5px 10px;
                cursor: pointer;
                transition: background-color 0.2s;
            }

                .toolbar button:hover {
                    background-color: #444444;
                }

                .toolbar button:active {
                    background-color: #555555;
                }

            .toolbar .view-group, .toolbar .sort-group {
                display: flex;
                gap: 5px;
            }

            .toolbar .address-bar {
                flex-grow: 1;
                background-color: #333333;
                color: #dddddd;
                border: 1px solid #444444;
                border-radius: 3px;
                padding: 5px;
                font-size: 14px;
            }

        .file-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

            .file-list.grid {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: flex-start;
            }

        .item-button {
            background-color: #252526;
            color: #dddddd;
            border: 1px solid #333333;
            border-radius: 3px;
            padding: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        .file-list.list .item-button {
            width: calc(100% - 16px);
        }

        .file-list.grid .item-button {
            width: 150px;
            flex-direction: column;
            text-align: center;
        }

        .item-button:hover {
            background-color: #333333;
        }

        .item-button:active {
            background-color: #444444;
        }

        .dir::before {
            content: '📁';
            font-size: 18px;
        }

        .file::before {
            content: '📄';
            font-size: 18px;
        }

        .file-list.grid .dir::before, .file-list.grid .file::before {
            font-size: 32px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 18px;
            color: #dddddd;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button data-hook="back">← Back</button>
        <button data-hook="forward">Forward →</button>
        <button data-hook="up">Up</button>
        <div class="address-bar"><!--CURRENT_DIR--></div>
        <div class="view-group">
            <button data-hook="view-list">List</button>
            <button data-hook="view-grid">Grid</button>
        </div>
        <div class="sort-group">
            <button data-hook="sort-name">Sort by Name</button>
            <button data-hook="sort-size">Sort by Size</button>
            <button data-hook="sort-date">Sort by Date</button>
        </div>
    </div>
    <div class="file-list" id="file-list">
        <h2>Files in <!--CURRENT_DIR--></h2>
        <!--DYNAMIC_ITEMS-->
    </div>
</body>
</html>
