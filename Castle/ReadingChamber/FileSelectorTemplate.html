<DOCUMENT filename="FileSelectorTemplate.html">
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #121212;
                color: #ffffff;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }

            .toolbar {
                display: flex;
                align-items: center;
                background-color: #1e1e1e;
                padding: 5px;
                border-bottom: 1px solid #333333;
                gap: 5px;
            }

                .toolbar button {
                    background-color: rgba(51, 51, 51, 0.8);
                    color: #ffffff;
                    border: 1px solid rgba(128, 128, 128, 1);
                    border-radius: 5px;
                    padding: 5px 10px;
                    cursor: pointer;
                    transition: background-color 0.2s;
                }

                    .toolbar button:hover {
                        background-color: rgba(77, 77, 77, 0.8);
                    }

                    .toolbar button:active {
                        background-color: rgba(100, 100, 100, 0.8);
                    }

                .toolbar .view-group, .toolbar .sort-group {
                    display: flex;
                    gap: 5px;
                }

                .toolbar .address-bar {
                    flex-grow: 1;
                    background-color: #1e1e1e;
                    color: #ffffff;
                    border: 1px solid #333333;
                    border-radius: 5px;
                    padding: 5px;
                    font-size: 14px;
                }

            .file-container {
                flex-grow: 1;
                overflow-y: auto;
                padding: 10px;
            }

            .file-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 14px;
            }

                .file-table th {
                    background-color: #1e1e1e;
                    padding: 8px;
                    text-align: left;
                    border-bottom: 1px solid #333333;
                }

                .file-table td {
                    padding: 8px;
                    border-bottom: 1px solid #333333;
                }

                .file-table tr:hover {
                    background-color: rgba(77, 77, 77, 0.8);
                }

                .file-table tr:active {
                    background-color: rgba(100, 100, 100, 0.8);
                }

                .file-table .icon {
                    width: 30px;
                    text-align: center;
                }

                .file-table .name {
                    flex: 1;
                }

                .file-table .size, .file-table .date {
                    width: 120px;
                    text-align: right;
                }

            .file-grid {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                justify-content: flex-start;
            }

            .grid-item {
                width: 120px;
                height: 120px;
                background-color: rgba(51, 51, 51, 0.8);
                border: 1px solid rgba(128, 128, 128, 1);
                border-radius: 5px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: background-color 0.2s;
                text-align: center;
                word-break: break-all;
                padding: 10px;
            }

                .grid-item:hover {
                    background-color: rgba(77, 77, 77, 0.8);
                }

                .grid-item:active {
                    background-color: rgba(100, 100, 100, 0.8);
                }

                .grid-item .icon {
                    font-size: 48px;
                    margin-bottom: 10px;
                }

            h2 {
                margin-bottom: 20px;
                font-size: 18px;
                color: #dddddd;
            }
        </style>
    </head>
    <body>
        <div class="toolbar">
            <button data-hook="back">← Back</button>
            <button data-hook="forward">Forward →</button>
            <button data-hook="up">Up</button>
            <div class="address-bar"><!--CURRENT_DIR--></div>
            <div class="view-group">
                <button data-hook="view-list">List</button>
                <button data-hook="view-grid">Grid</button>
            </div>
            <div class="sort-group">
                <button data-hook="sort-name">Sort by Name</button>
                <button data-hook="sort-size">Sort by Size</button>
                <button data-hook="sort-date">Sort by Date</button>
            </div>
        </div>
        <div class="file-container">
            <table class="file-table" id="file-table" style="display: none;">
                <thead>
                    <tr>
                        <th class="icon"></th>
                        <th class="name">Name</th>
                        <th class="size">Size</th>
                        <th class="date">Modified</th>
                    </tr>
                </thead>
                <tbody>
                    <!--DYNAMIC_ITEMS-->
                </tbody>
            </table>
            <div class="file-grid" id="file-grid" style="display: none;">
                <!--DYNAMIC_GRID_ITEMS-->
            </div>
        </div>
        <script>
        // Script to toggle views
        function toggleView(view) {
            document.getElementById('file-table').style.display = view === 'list' ? 'table' : 'none';
            //document.getElementById('file-grid').style.display = view === 'grid' ? 'flex' : 'none';
        }
        // Initial view
        toggleView('list');
        </script>
    </body>
</html>
</DOCUMENT>
