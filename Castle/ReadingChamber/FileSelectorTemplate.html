<DOCUMENT filename="FileSelectorTemplate.html">
    <!-- Folder: ReadingChamber -->
    <!-- File: FileSelectorTemplate.html -->
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #121212;
                color: #ffffff;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }

            .toolbar {
                display: flex;
                align-items: center;
                background-color: #1e1e1e;
                padding: 5px;
                border-bottom: 1px solid #333333;
                gap: 5px;
            }

                .toolbar button {
                    background-color: rgba(51, 51, 51, 0.8);
                    color: #ffffff;
                    border: 1px solid rgba(128, 128, 128, 1);
                    border-radius: 5px;
                    padding: 5px 10px;
                    cursor: pointer;
                    transition: background-color 0.2s;
                }

                    .toolbar button:hover {
                        background-color: rgba(77, 77, 77, 0.8);
                    }

                    .toolbar button:active {
                        background-color: rgba(100, 100, 100, 0.8);
                    }

                .toolbar .view-group, .toolbar .sort-group {
                    display: flex;
                    gap: 5px;
                }

                .toolbar .address-bar {
                    flex-grow: 1;
                    background-color: #1e1e1e;
                    color: #ffffff;
                    border: 1px solid #333333;
                    border-radius: 5px;
                    padding: 5px;
                    font-size: 14px;
                }

            .file-list {
                flex-grow: 1;
                overflow-y: auto;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 5px;
            }

                .file-list.grid {
                    flex-direction: row;
                    flex-wrap: wrap;
                    justify-content: flex-start;
                }

            .item-button {
                background-color: rgba(51, 51, 51, 0.8);
                color: #ffffff;
                border: 1px solid rgba(128, 128, 128, 1);
                border-radius: 5px;
                padding: 8px;
                cursor: pointer;
                transition: background-color 0.2s;
                display: flex;
                align-items: center;
                gap: 5px;
                font-size: 14px;
            }

            .file-list.list .item-button {
                width: auto;
                max-width: 100%;
                justify-content: flex-start;
            }

            .file-list.list .name {
                flex: 1;
            }

            .file-list.list .size, .file-list.list .date {
                width: 120px;
                text-align: right;
                margin-left: 10px;
            }

            .file-list.grid .item-button {
                width: 120px;
                height: 120px;
                flex-direction: column;
                justify-content: center;
                text-align: center;
                word-break: break-all;
            }

            .item-button:hover {
                background-color: rgba(77, 77, 77, 0.8);
            }

            .item-button:active {
                background-color: rgba(100, 100, 100, 0.8);
            }

            .dir::before {
                content: '📁';
                font-size: 18px;
            }

            .file::before {
                content: '📄';
                font-size: 18px;
            }

            .file-fbx::before {
                content: '🗿';
                font-size: 18px;
            }

            .file-png::before, .file-jpg::before, .file-jpeg::before, .file-gif::before {
                content: '🖼️';
                font-size: 18px;
            }

            .file-txt::before, .file-md::before {
                content: '📝';
                font-size: 18px;
            }

            .file-json::before, .file-xml::before {
                content: '⚙️';
                font-size: 18px;
            }

            .file-list.grid .dir::before, .file-list.grid .file::before, .file-list.grid .file-fbx::before, .file-list.grid .file-png::before {
                font-size: 48px;
            }

            h2 {
                margin-bottom: 20px;
                font-size: 18px;
                color: #dddddd;
            }
        </style>
    </head>
    <body>
        <div class="toolbar">
            <button data-hook="back">← Back</button>
            <button data-hook="forward">Forward →</button>
            <button data-hook="up">Up</button>
            <div class="address-bar"><!--CURRENT_DIR--></div>
            <div class="view-group">
                <button data-hook="view-list">List</button>
                <button data-hook="view-grid">Grid</button>
            </div>
            <div class="sort-group">
                <button data-hook="sort-name">Sort by Name</button>
                <button data-hook="sort-size">Sort by Size</button>
                <button data-hook="sort-date">Sort by Date</button>
            </div>
        </div>
        <div class="file-list" id="file-list">
            <h2>Files in <!--CURRENT_DIR--></h2>
            <!--DYNAMIC_ITEMS-->
        </div>
    </body>
</html>
</DOCUMENT>
