<!DOCTYPE html>
<html>
<head>
    <title>2D Sprite Creator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #ddd;
            padding: 16px;
            margin: 0;
            width: 100%;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 22px 0;
            color: #4fc3f7;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .status {
            font-size: 13.5px;
            color: #aaa;
            padding: 12px;
            background: #252526;
            border: 1px solid #383838;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h2>🖼️ 2D Sprite Creator</h2>
    <div class="status" id="statusText">
        Select a sprite in the Sprite Tool panel → move mouse over scene → click to place<br>
        <small>Grid = world reference • Ghost follows mouse on flat plane</small>
    </div>
</body>
</html>
