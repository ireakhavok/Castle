<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background: rgba(30,30,30,0.95);
            color: #fff;
            font-family: sans-serif;
            padding: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 12px 20px;
            align-items: center;
        }

        label {
            text-align: right;
            font-weight: bold;
        }

        input, select, button {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #222;
            color: #fff;
        }

        button {
            background: #0a84ff;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background: #3da0ff;
            }

        .modal-footer {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <h3>New Terrain</h3>
    <div class="form-grid">
        <label>Name</label>
        <input id="name" type="text" value="NewTerrain" />

        <label>Type</label>
        <select id="type">
            <option value="Flat" selected>Flat Plane</option>
            <option value="GeoTIFF">Import GeoTIFF</option>
            <option value="Spherical" disabled>Spherical (coming soon)</option>
        </select>

        <label>Width (m)</label>
        <input id="width" type="number" value="2048" />

        <label>Depth (m)</label>
        <input id="depth" type="number" value="2048" />

        <label>Grid Spacing</label>
        <select id="resolution">
            <option value="0.01">1 cm</option>
            <option value="0.5">0.5 m</option>
            <option value="1" selected>1 m</option>
            <option value="3">3 m</option>
            <option value="5">5 m</option>
            <option value="10">10 m</option>
        </select>

        <label>Initial Height</label>
        <input id="initialHeight" type="number" value="0" />

        <label>Vertical Exag.</label>
        <input id="vertExag" type="number" value="1.0" step="0.1" min="0.5" max="10" />

        <label></label>
        <button id="browse" data-hook="BrowseGeoTIFF">Browse GeoTIFF...</button>
    </div>

    <div class="modal-footer">
        <button data-hook="CancelNewTerrain">Cancel</button>
        <button data-hook="CreateTerrain" style="background:#0a0;">Create</button>
    </div>
</body>
</html>
